version: '3.8'

services:
  smart-chat-bot:
    build: .
    ports:
      - "5000:5000"
    environment:
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=5000
      - CHROME_HEADLESS=true
      - FLASK_DEBUG=false
      - WEBHOOK_SECRET_TOKEN=${WEBHOOK_SECRET_TOKEN:-change-me-in-production}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: smart-chat-bot-network